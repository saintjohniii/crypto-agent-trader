# Paper trading agent — R2,500 on Luno ZAR pairs (simulated fills)

capital:
  starting_zar: 2500
  base_currency: ZAR

trading:
  exchange: luno
  symbols:
    - XBTZAR
    - ETHZAR
    - XRPZAR
  watch_symbols:
    # SOLZAR demoted to watch-only 2026-07-18: worst PF (0.17-0.32) in every tested config
    # and ~2/3 of all losses while its own market fell least — strategy overtrades its
    # volatility. Still analyzed and shown on the dashboard, but never traded.
    - SOLZAR
  interval: 1h
  loop_seconds: 120

leverage:
  enabled: false          # Luno is spot-only — paper matches that
  max: 1
  default: 1

fees:
  taker_pct: 0.001        # ~0.10% per side (approx Luno maker/taker band)

execution:
  use_live_spread: true   # paper buys at Luno ask and sells at Luno bid
  slippage_bps: 5         # additional 0.05% adverse movement per fill
  max_spread_bps: 35      # reject new trades when live spread exceeds 0.35%
  assumed_spread_bps: 10  # synthetic half-spread for backtests (total 10 bps)

risk:
  max_position_pct: 0.20  # max 20% of equity per position (more pairs, smaller slices)
  stop_loss_pct: 0.015    # fallback when ATR stops disabled/unavailable
  take_profit_pct: 0.03
  atr_stops:
    enabled: true         # scale SL/TP to each pair's volatility
    stop_mult: 2.0        # stop = 2 x ATR
    tp_mult: 4.0          # TP = 4 x ATR (keeps 2:1 bracket)
    min_stop_pct: 0.008
    max_stop_pct: 0.04
  risk_per_trade_pct: 0.01  # size so a stop-out costs ~1% of equity (capped by max_position_pct)
  max_daily_loss_pct: 0.10
  max_open_positions: 3
  min_order_zar: 50
  min_reward_cost_multiple: 3.0  # expected TP reward must be >= 3x round-trip cost
  signal_exit_only_in_profit: true  # bearish-cross exits only lock in gains; stop-loss handles losers

strategy:
  ema_fast: 9
  ema_slow: 21
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  breakout_period: 20
  news_block_threshold: -0.4
  news_boost_threshold: 0.3
  range_mode:
    enabled: false        # mean-reversion longs in RANGE regime — tested 2026-07: the setup
    rsi_max: 32           # (RANGE + oversold near prior low) never occurs; oversold-at-low
    low_tolerance_pct: 0.03  # always classifies as TREND_DOWN under the current regime logic
  htf_filter:
    enabled: false        # off 2026-07-31: redundant with the TREND_UP regime gate and it
                          # cost trades for nothing — removing it raised PF on both the 180d
                          # (0.74 -> 0.89) and 90d windows. Flip to true to re-gate on 4h.
    interval: 4h
    ema_fast: 9
    ema_slow: 21
  regime:
    enabled: true
    allow_regimes: [TREND_UP]  # regimes allowed to open new longs. Adding RANGE was measured
                          # 2026-07-31 and is destructive: 166 vs 67 trades but PF 0.74 -> 0.63,
                          # net -R87 -> -R304, drawdown 6% -> 15.6%. Chop breakouts are the losers.
    atr_period: 14
    range_atr_mult: 0.8   # low vol / chop threshold
    trend_ema_pct: 0.001  # min |fast-slow|/price for trend (0.1%). Loosened from 0.002 on
                          # 2026-07-31 to trade more: +69% trades on 180d, PF and PnL improved
                          # on both windows. Going lower (0.0005) or cutting chop filter degrades.

news:
  feeds:
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
    - https://decrypt.co/feed
    - https://www.theblock.co/rss.xml
    - https://bitcoinmagazine.com/.rss/full/
    - https://feeds.bbci.co.uk/news/business/rss.xml
    - https://news.google.com/rss/search?q=bitcoin+OR+ethereum+OR+crypto&hl=en-US&gl=US&ceid=US:en
    - https://news.google.com/rss/search?q=federal+reserve+OR+interest+rates+OR+inflation&hl=en-US&gl=US&ceid=US:en
  scout:
    interval_seconds: 300   # scout refresh cadence (24/7)
    cache_max_age_min: 15   # trading agent uses cache if fresher than this
    half_life_hours: 6      # recency weighting for headline scores
    max_per_feed: 20

paths:
  state_file: data/portfolio.json
  trades_log: data/trades.jsonl
  equity_log: data/equity.jsonl
  backtest_report: data/backtest_last.json
  news_cache: data/news_cache.json
  news_log: data/news_log.jsonl
